name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The runner is pinned per interpreter, not shared. setup.cfg declares
    # python_requires = >=3.9 and the README badge says 3.9+, so the 3.9 job is
    # what makes that claim true; ubuntu-latest moved to 26.04, which no longer
    # offers a 3.9 build, and the job failed at setup-python before running a
    # test. Pinning the floor to the newest image that still has 3.9 keeps the
    # claim tested. Do not replace this with ubuntu-latest: that drops 3.9
    # coverage silently. If 3.9 disappears from 24.04 too, raise the floor in
    # setup.cfg and the README in the same change, deliberately.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Cache the sentence-transformers model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2

      # Rules and per-file exceptions live in setup.cfg, so this and `make lint`
      # cannot drift apart.
      - name: Lint
        run: python -m flake8 src/ experiments/ tools/ tests/ main.py run.py quickstart.py conftest.py

      - name: Test
        run: python -m pytest tests/ -q

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # experiments.config imports numpy; nothing else in the export needs more.
      - name: Install export dependencies
        run: pip install numpy

      # The tables and macros are generated from results/. If the committed
      # copies differ from what results/ produces, the paper is quoting stale
      # numbers, and that is a build failure.
      - name: Tables match results/
        run: |
          python -m experiments.export_latex
          git diff --exit-code paper/tables

      - uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the pinned ACL style
        run: make paper/acl.sty paper/acl_natbib.bst

      - name: Build
        working-directory: paper
        run: tectonic -X compile main.tex 2>&1 | tee build.log

      - name: No undefined references, citations or missing glyphs
        working-directory: paper
        run: |
          if grep -E "undefined|Missing character|could not represent" build.log; then
            exit 1
          fi

      # The layout tests read dist/review.pdf and skip when it is absent, which
      # the test jobs always are: they never build the paper. That is how a
      # body running two thirds of a page past ARR's eight-page limit passed CI.
      # main.tex is already in review mode, so the built PDF is the review PDF;
      # `make submission` cannot run here because the identity patterns it
      # scans for are deliberately not in the repository.
      - name: Install layout-check dependencies
        run: pip install pandas==2.3.3 pytest==8.4.2 pdfminer.six==20251107 pypdf==6.19.0

      - name: Page limit and layout
        run: |
          mkdir -p dist
          cp paper/main.pdf dist/review.pdf
          python -m pytest tests/test_experiments.py -k TestPaperLayout -q -rs 2>&1 | tee layout.log
          status=${PIPESTATUS[0]}
          # A skipped layout test is an unchecked page limit, not a pass.
          if grep -q "skipped" layout.log; then
            echo "a layout test was skipped; the page limit was not checked"
            exit 1
          fi
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/main.pdf
